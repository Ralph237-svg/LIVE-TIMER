<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Timer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="iclass">

        </div>
        <div class="info">
            <h1>Digital</h1>
            <h2>Clock</h2>
        </div>
    </header>
    <p>Real-time . Mordern. Simple</p>

<div class="container">
    <div class="calendar">
        <!--calender icon-->
        <h3 class="cal" id="cal">
            
        </h3>
    </div>
    <div class="section-box">
        <div class="box">
            <div class="live">
                <!--time sign here-->
                <h3>Live Time</h3>
            </div>
            <div class="whole">
            <div class="time" id="time">
                00:00:00
            </div>
            <div class="indicate">
                    AM
            </div>
            </div>
            <div class="date" id="date">

            </div>


            <div class="hour">
                <div class="hour1">
                    <div class="indicator" id="indicator">
                        <h3>AM</h3>
                    </div>
                    <div class="pm" id="pm">
                        <h3>PM</h3>
                    </div>
                </div>
                <span></span>
                <div class="hour2">
                    <div class="h24" id="h24">
                        <button id="btn24">24H</button>
                    </div>
                    <div class="h12" id="h12">
                        <button id="btn12">12H</button>
                    </div>
                </div>
            </div>


        </div>
    </div>
</div>
<script src="index.js"></script>
</body>
</html>
